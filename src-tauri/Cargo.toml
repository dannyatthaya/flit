[package]
name = "flit"
version = "0.1.0"
description = "A fast, private YouTube Music desktop client"
authors = ["Flit"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop-only plugins (Flit targets Windows/Linux/macOS, not mobile).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"

# Windows-only: remove the DWM hairline border on the borderless popup while
# keeping the window shadow.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
# Read the installed WebView2 (Chromium) version for an accurate user agent.
# Keep the version in step with the one tauri-runtime-wry uses (see Cargo.lock).
wry = { version = "0.55", default-features = false, features = ["os-webview"] }

# Optimize the release build for a small, fast binary (design goal #1).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
